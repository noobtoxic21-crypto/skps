        // ==========================================
        function BatchBillingTab({ showToast, fetchSummary }) {
            const [monthYear, setMonthYear] = useState("October 2026");
            const [academicYear, setAcademicYear] = useState("2026-2027");
            const [isGenerating, setIsGenerating] = useState(false);
            const [billResult, setBillResult] = useState(null);

            const handleGenerateBills = async (e) => {
                e.preventDefault();
                setIsGenerating(true);
                setBillResult(null);

                try {
                    const res = await fetch(`${API_BASE}/api/generate-monthly-bills`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            month_year: monthYear,
                            academic_year: academicYear
                        })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || "Generation failed");
                    setBillResult(data);
                    showToast(data.message, "success");
                    fetchSummary();
                } catch (err) {
                    showToast(err.message, "error");
                } finally {
                    setIsGenerating(false);
                }
            };

            return (
                <div class="max-w-2xl mx-auto space-y-6">
                    <div class="bg-white rounded-xl shadow-sm border p-8">
                        <div class="text-center mb-6">
                            <div class="text-4xl mb-2">⚡</div>
                            <h3 class="text-xl font-bold text-slate-900">Automated Monthly Batch Billing</h3>
                            <p class="text-xs text-slate-500 mt-1">
                                Auto-calculates fees for all active St. Kabir Public School students based on class fee heads, subtracts flat discounts, adds previous dues balance, and updates ledgers.
                            </p>
                        </div>

                        <form onSubmit={handleGenerateBills} class="space-y-4 text-sm">
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Billing Month & Year *</label>
                                    <input
                                        type="text"
                                        value={monthYear}
                                        onChange={(e) => setMonthYear(e.target.value)}
                                        placeholder="e.g. October 2026"
                                        class="w-full p-3 bg-slate-50 border rounded-lg font-bold"
                                        required
                                    />
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Academic Year *</label>
                                    <input
                                        type="text"
                                        value={academicYear}
                                        onChange={(e) => setAcademicYear(e.target.value)}
                                        placeholder="e.g. 2026-2027"
                                        class="w-full p-3 bg-slate-50 border rounded-lg font-bold"
                                        required
                                    />
                                </div>
                            </div>

                            <button
                                type="submit"
                                disabled={isGenerating}
                                class="w-full py-4 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl shadow-lg transition text-base"
                            >
                                {isGenerating ? "Generating Charge Sheets..." : "🚀 Run Batch Bill Generation For All Students"}
                            </button>
                        </form>

                        {billResult && (
                            <div class="mt-6 bg-emerald-50 border border-emerald-200 p-4 rounded-xl text-emerald-900 text-sm">
                                <h4 class="font-bold flex items-center gap-2">✅ Batch Billing Completed</h4>
                                <p class="mt-1">{billResult.message}</p>
                                <div class="mt-2 text-xs font-mono font-bold flex gap-4">
                                    <span>Students Billed: {billResult.count}</span>
                                    <span>Total Net Billed: ₹{billResult.total_gross_billed.toLocaleString('en-IN')}</span>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ==========================================
        // 5. REPORTS & DEFAULTERS TAB
        // ==========================================
        function ReportsTab({ summary, classList, showToast }) {
            const [defaulters, setDefaulters] = useState([]);
            const [selectedClass, setSelectedClass] = useState("");
            const [searchQuery, setSearchQuery] = useState("");

            useEffect(() => {
                fetchDefaulters();
            }, [selectedClass, searchQuery]);

            const fetchDefaulters = async () => {
                let url = `${API_BASE}/api/students?balance_status=DEFAULTER&q=${encodeURIComponent(searchQuery)}`;
                if (selectedClass) url += `&class_id=${selectedClass}`;
                try {
                    const res = await fetch(url);
                    setDefaulters(await res.json());
                } catch (e) {
                    console.error("Failed to load defaulters", e);
                }
            };

            const exportCSV = () => {
                if (defaulters.length === 0) {
                    showToast("No defaulter data to export", "error");
                    return;
                }
                const headers = ["Admission No", "Student Name", "Class", "Father Name", "Contact", "Pending Dues Balance (Rs)"];
                const rows = defaulters.map(s => [
                    `"${s.admission_no}"`,
                    `"${s.name}"`,
                    `"${s.class_name}"`,
                    `"${s.father_name || ''}"`,
                    `"${s.contact_no || ''}"`,
                    s.current_balance
                ]);

                const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `St_Kabir_Defaulters_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("Defaulters report exported as CSV!", "success");
            };

            return (
                <div class="space-y-6">

                        <div class="bg-white rounded-xl shadow-sm border p-6 border-l-4 border-l-amber-500">

                    <div class="bg-white rounded-xl shadow-sm border p-6">
                        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-4">

                            <div class="flex items-center gap-3 w-full md:w-auto">

                e.preventDefault();
                try {
                    const res = await fetch(`${API_BASE}/api/users`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            username: newUsername,
                            password: newPassword,
                            full_name: newFullName,
                            role: newRole
                        })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || "Error creating user");

                    showToast(`User ID '${newUsername}' created successfully!`, "success");
                    setNewUsername("");
                    setNewPassword("");
                    setNewFullName("");
                    fetchUsers();
                } catch (err) {
                    showToast(err.message, "error");
                }
            };

            const handleDeleteUser = async (userId, username) => {
                if (!confirm(`Are you sure you want to delete staff account '${username}'?`)) return;
                try {
                    await fetch(`${API_BASE}/api/users/${userId}`, { method: "DELETE" });
                    showToast(`User account '${username}' deleted.`, "success");
                    fetchUsers();
                } catch (e) {
                    showToast("Failed to delete user", "error");
                }
            };

            return (
                <div class="space-y-8 max-w-5xl mx-auto">
                    <div class="bg-white rounded-xl shadow-sm border p-6">
                        <h3 class="font-bold text-xl text-slate-900 mb-2 flex items-center gap-2">
                            <span>👥</span> Staff User Accounts & Password Management
                        </h3>
                        <p class="text-xs text-slate-500 mb-6">
                            Only Principal / Admin accounts can create and delete Cashier & Admin User IDs.
                        </p>

                        <div class="overflow-x-auto mb-8">
                            <table class="w-full text-sm text-left border">
                                <thead class="bg-slate-800 text-white text-xs uppercase font-semibold">
                                    <tr>
                                        <th class="p-3">User ID (Username)</th>
                                        <th class="p-3">Staff Full Name</th>
                                        <th class="p-3">Assigned Role</th>
                                        <th class="p-3">Created On</th>
                                        <th class="p-3 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    {users.map(u => (
                                        <tr key={u.id} class="hover:bg-slate-50">
                                            <td class="p-3 font-mono font-bold text-slate-900">{u.username}</td>
                                            <td class="p-3 font-semibold text-slate-800">{u.full_name}</td>
                                            <td class="p-3">
                                                <span class={`px-2.5 py-1 rounded text-xs font-bold ${
                                                    u.role === 'ADMIN' 
                                                    ? 'bg-purple-100 text-purple-800 border border-purple-200' 
                                                    : 'bg-sky-100 text-sky-800 border border-sky-200'
                                                }`}>
                                                    {u.role === 'ADMIN' ? '👑 ADMIN' : '👤 CASHIER'}
                                                </span>
                                            </td>
                                            <td class="p-3 text-xs text-slate-500 font-mono">{u.created_at}</td>
                                            <td class="p-3 text-right">
                                                {u.username !== 'admin' && (
                                                    <button
                                                        onClick={() => handleDeleteUser(u.id, u.username)}
                                                        class="px-3 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded text-xs font-bold border border-rose-200"
                                                    >
                                                        🗑️ Delete
                                                    </button>
                                                )}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>

                        {/* CREATE USER FORM */}
                        <div class="bg-slate-50 p-6 rounded-xl border">
                            <h4 class="font-bold text-slate-900 mb-4 flex items-center gap-2">
                                ➕ Create New Staff User ID & Password
                            </h4>
                            <form onSubmit={handleCreateUser} class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">User ID / Username *</label>
                                    <input
                                        type="text"
                                        value={newUsername}
                                        onChange={(e) => setNewUsername(e.target.value)}
                                        placeholder="e.g. cashier2"
                                        class="w-full p-2.5 bg-white border rounded-lg font-mono"
                                        required
                                    />
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Password *</label>
                                    <input
                                        type="password"
                                        value={newPassword}
                                        onChange={(e) => setNewPassword(e.target.value)}
                                        placeholder="Enter password"
                                        class="w-full p-2.5 bg-white border rounded-lg"
                                        required
                                    />
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Staff Full Name *</label>
                                    <input
                                        type="text"
                                        value={newFullName}
                                        onChange={(e) => setNewFullName(e.target.value)}
                                        placeholder="e.g. Ramesh Kumar"
                                        class="w-full p-2.5 bg-white border rounded-lg"
                                        required
                                    />
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Assign Security Role *</label>
                                    <select
                                        value={newRole}
                                        onChange={(e) => setNewRole(e.target.value)}
                                        class="w-full p-2.5 bg-white border rounded-lg font-bold"
                                    >
                                        <option value="CASHIER">👤 CASHIER (Data Entry Counter)</option>
                                        <option value="ADMIN">👑 ADMIN (Principal / Accountant)</option>
                                    </select>
                                </div>
                                <div class="sm:col-span-2 pt-2">
                                    <button
                                        type="submit"
                                        class="w-full py-3 bg-purple-700 hover:bg-purple-800 text-white font-bold rounded-xl shadow-lg transition"
                                    >
                                        Create Staff Account
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 7. LAN SETUP GUIDE TAB
        // ==========================================
        function LanSetupTab({ lanInfo }) {
            return (
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="bg-white rounded-xl shadow-sm border p-8">
                        <div class="flex items-center gap-4 border-b pb-6 mb-6">
                            <div class="w-14 h-14 bg-sky-100 text-sky-700 rounded-xl flex items-center justify-center text-3xl font-bold">
                                🌐
                            </div>
                            <div>
                                <h3 class="text-2xl font-bold text-slate-900">Campus LAN Setup & Connection Guide</h3>
                                <p class="text-sm text-slate-500">Access St. Kabir Public School fee system from any cashier laptop or principal computer on campus Wi-Fi/LAN.</p>
                            </div>
                        </div>

                        <div class="bg-sky-50 border border-sky-200 rounded-xl p-5 mb-8">
                            <span class="text-xs uppercase tracking-wider text-sky-800 font-bold block mb-1">Host Server Access URL</span>
                            <div class="flex items-center justify-between">
                                <span class="font-mono text-2xl font-black text-sky-900">{lanInfo.access_url}</span>
                                <span class="bg-sky-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg">LIVE ON LOCAL NETWORK</span>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-sm">
                            <div class="border rounded-xl p-5 bg-slate-50">
                                <h4 class="font-bold text-slate-900 mb-2 flex items-center gap-2">
                                    <span class="w-6 h-6 rounded-full bg-slate-900 text-white flex items-center justify-center text-xs">1</span>
                                    Static Local IP Setup
                                </h4>
                                <p class="text-xs text-slate-600 leading-relaxed">
                                    Assign a static IP (e.g. <b>{lanInfo.local_ip}</b>) to this host computer in Windows Network Settings $\rightarrow$ IPv4 Properties so the URL never changes when router restarts.
                                </p>
                            </div>

                            <div class="border rounded-xl p-5 bg-slate-50">
                                <h4 class="font-bold text-slate-900 mb-2 flex items-center gap-2">
                                    <span class="w-6 h-6 rounded-full bg-slate-900 text-white flex items-center justify-center text-xs">2</span>
                                    Firewall Inbound Rule
                                </h4>
                                <p class="text-xs text-slate-600 leading-relaxed">
                                    If other PCs cannot connect, open Windows Defender Firewall $\rightarrow$ Inbound Rules $\rightarrow$ Add New Rule for Port <b>8000</b>.
                                </p>
                            </div>

                            <div class="border rounded-xl p-5 bg-slate-50">
                                <h4 class="font-bold text-slate-900 mb-2 flex items-center gap-2">
                                    <span class="w-6 h-6 rounded-full bg-slate-900 text-white flex items-center justify-center text-xs">3</span>
                                    Backend Host Binding
                                </h4>
                                <p class="text-xs text-slate-600 leading-relaxed">
                                    Backend runs on <b>0.0.0.0:8000</b> allowing all incoming campus router traffic.
                                </p>
                            </div>

                            <div class="border rounded-xl p-5 bg-slate-50">
                                <h4 class="font-bold text-slate-900 mb-2 flex items-center gap-2">
                                    <span class="w-6 h-6 rounded-full bg-slate-900 text-white flex items-center justify-center text-xs">4</span>
                                    Open Browser on Campus PCs
                                </h4>
                                <p class="text-xs text-slate-600 leading-relaxed">
                                    On cashier laptops, open browser and navigate directly to <b class="font-mono text-sky-700">{lanInfo.access_url}</b>.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
